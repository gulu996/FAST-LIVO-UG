<!doctype html><html><head><meta charset="utf-8"><title>VPPC renderer check</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head>
<body><canvas id="c" style="width:400px;height:300px"></canvas><pre id="result">RUNNING</pre>
<script type="module">
import { PointCloudRenderer } from '../src/pointcloud_renderer.js';
const assert = (ok, label) => { if (!ok) throw new Error(label); };
let viewer;
try {
  viewer = new PointCloudRenderer(document.getElementById('c'));
  const cloud = viewer.cloud;
  const frame = { count: 2, positions: new Float32Array([1, 2, 3, 4, 5, 6]),
                  intensities: new Float32Array([0, 100]),
                  bounds: { low: [1, 2, 3], high: [4, 5, 6] } };
  const intensity = viewer.setFrame(frame);
  viewer.draw();
  assert(viewer.cloud === cloud && viewer.rosRoot.children.filter(x => x.isPoints).length === 2 && !viewer.historyCloud.visible, 'current layer plus hidden history layer');
  assert(viewer.geometry.drawRange.count === 2 && viewer.geometry.getAttribute('position').array[0] === 1, 'XYZ');
  const color = viewer.geometry.getAttribute('color').array;
  assert(color[2] === 1 && color[3] === 1 && color[4] === 0 && intensity.p5 === 5 && intensity.p95 === 95, 'intensity rainbow');
  viewer.setFrame({ ...frame, rgb: new Uint8Array([255, 0, 0, 0, 128, 255]), intensities: null });
  assert(viewer.geometry.getAttribute('color').array[0] === 1 && viewer.geometry.getAttribute('color').array[1] === 0, 'RGB red');
  assert(viewer.geometry.getAttribute('color').array[4] > 0.2 && viewer.geometry.getAttribute('color').array[4] < 0.23, 'sRGB green');
  assert(Math.abs(viewer.rosRoot.rotation.x + Math.PI / 2) < 1e-9, 'root coordinate transform');
  const count = viewer.geometryCount;
  for (let i = 0; i < 100; i++) { viewer.setFrame(frame); viewer.draw(); }
  assert(viewer.geometryCount === count && viewer.geometry.drawRange.count === 2, 'geometry reuse');
  viewer.setFrame({ count: 1, positions: new Float32Array([7, 8, 9]),
                    intensities: new Float32Array([50]),
                    bounds: { low: [7, 8, 9], high: [7, 8, 9] } });
  viewer.draw();
  assert(viewer.cloud === cloud && viewer.geometry.drawRange.count === 1, 'replacement, no history');
  viewer.setMode('white');
  viewer.setPointSize(5);
  assert(viewer.cloud.material === viewer.whiteMaterial && viewer.whiteMaterial.size === 5, 'controls');
  document.getElementById('result').textContent = 'PASS XYZ, RGB, intensity rainbow, transform, replacement, GPU reuse';
  document.body.dataset.result = 'PASS';
} catch (error) {
  document.getElementById('result').textContent = `FAIL ${error.stack || error}`;
  document.body.dataset.result = 'FAIL';
} finally { if (viewer) viewer.dispose(); }
</script></body></html>
