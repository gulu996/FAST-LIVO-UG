rtk_backend:
  enable: true

  # Raw UWB ranges share this backend's Pose3 states when enabled.
  # The legacy uwb/update_en path is then forcibly disabled.
  uwb_factor_backend_en: false
  uwb_range_topic: "/uwb/backend_ranges"
  uwb_association_max_dt_s: 0.05
  uwb_max_nis: 9.0 # Conservative scalar NIS gate; rejects branch-changing NLOS.
  uwb_huber_delta: 2.5
  # Empty means all enabled entries in uwb/anchors.
  uwb_anchor_allowlist: []

  accept_rtk_fixed: true
  accept_rtk_float: false
  accept_differential: true
  accept_single: false

  raw_odom_topic: "/backend/livo_odom_raw"
  gnss_odom_topic: "/gnss_fusion/enu_odom"
  gnss_status_topic: "/gnss_fusion/status"
  optimized_odom_topic: "/rtk_backend/optimized_odom"
  optimized_path_topic: "/rtk_backend/optimized_path"
  map_to_odom_topic: "/rtk_backend/map_to_odom"
  status_topic: "/rtk_backend/status"

  lag_seconds: 20.0
  keyframe_translation_m: 0.8
  keyframe_rotation_deg: 8.0
  keyframe_max_interval_s: 1.0
  raw_odom_buffer_seconds: 5.0
  max_raw_odom_interpolation_gap_s: 0.15
  reuse_existing_node_time_diff_s: 0.02
  gnss_node_min_interval_s: 0.20
  max_active_states: 300

  alignment_min_pairs: 20
  alignment_min_baseline_m: 8.0
  alignment_max_pair_time_diff_s: 0.05
  alignment_max_rmse_m: 0.5

  # GNSS antenna lever arm.
  # Direction: FAST-LIVO body pose origin -> GNSS antenna reference point.
  # Expressed in the FAST-LIVO body/IMU state frame, unit: metre.
  # Axes are the body/IMU state axes. With config/mid360.yaml's current
  # extrinsic_R=identity they are parallel and same-sign to the Mid-360
  # point-cloud/IMU axes; vehicle forward/left/up still depends on mounting.
  # The endpoint must represent the physical point corresponding to the GNSS
  # position measurement, preferably the antenna ARP or calibrated APC,
  # not an arbitrary enclosure edge or top surface.
  antenna_lever_arm_body_m: [-0.151, -0.02329, 0.05512]

  min_gnss_sigma_xy_m: 0.03
  min_gnss_sigma_z_m: 0.05
  max_gnss_sigma_xy_m: 2.0
  max_gnss_sigma_z_m: 3.0
  max_gnss_residual_m: 3.0
  max_gnss_nis: 11.34
  robust_kernel: "huber"
  huber_delta: 2.5

  # GTSAM Pose3 tangent order is rotation xyz, then translation xyz.
  livo_translation_sigma_m: 0.05
  # Used only with UWB. Preserve LIVO-observed lateral/vertical motion while
  # ranges correct the weaker long-axis drift in corridor-style trajectories.
  livo_lateral_vertical_sigma_m: 0.001
  livo_rotation_sigma_rad: 0.01
  # Used only with UWB. Preserve LIVO/IMU relative attitude in every axis;
  # this is a BetweenFactor noise, not an absolute roll/pitch/yaw prior.
  livo_uwb_rotation_sigma_rad: 0.0003
  prior_translation_sigma_m: 0.10
  prior_roll_pitch_sigma_rad: 0.05
  prior_yaw_sigma_rad: 0.20
  # UWB anchors are already offline-aligned to the initial LIVO frame. Tighten
  # the existing first-pose prior only; it is marginalized normally and no
  # later pose receives an XYZ, height, yaw, or attitude prior.
  uwb_initial_prior_translation_sigma_m: 0.001
  uwb_initial_prior_rotation_sigma_rad: 0.001

  frame_id: "map"
  odom_frame_id: "odom"
  body_frame_id: "body"
  log_interval_s: 1.0

  save_results: true
  # Empty means: use save_path/YYYY-MM-DD-HHMMSS from the main node.
  output_directory: ""
  raw_online_file: "livo_raw_online.tum"
  optimized_online_file: "rtk_optimized_online.tum"
  optimized_final_file: "rtk_optimized_final.tum"
  gnss_file: "gnss_enu.tum"
  uwb_status_csv_file: "uwb_backend_measurements.csv"
  status_csv_file: "rtk_backend_status.csv"
  flush_interval_s: 1.0
  save_text_log: true
  text_log_file: "rtk_backend.log"
