gnss_adapter:
  enable: true
  # New offline solution bag: precomputed BASE-origin ENU with 6x6 pose
  # covariance. The message does not contain per-epoch RTK quality/satellite
  # metadata, so classify it conservatively as Float and keep num_sv unknown.
  input_mode: "pose_with_covariance_stamped"
  input_topic: "/tiaozhanbei/gnss/pose"
  output_odom_topic: "/gnss/enu_odom"
  output_status_topic: "/gnss_fusion/status"
  publish_local_enu_odometry: true
  pose_input_quality: 3  # GnssStatus.RTK_FLOAT; source message has no quality.
  pose_input_num_sv: 0   # Unknown; do not invent a satellite count.
  # The producer already encodes its complete Fixed/Float uncertainty policy
  # in pose.covariance. Do not apply backend quality/satellite inflation again.
  gnss_pose_covariance_authoritative: true

  # Unused in status-only mode; retained as valid defaults for the shared adapter.
  origin_mode: "first_fixed"
  origin_lla: [0.0, 0.0, 0.0]
  origin_average_count: 10
  origin_average_max_gap_s: 2.0

  # DATA_FORMAT.md: PPK uses 4-9 BDS satellites and provides position SDs,
  # but no PDOP or velocity accuracy. The converter marks those as 999.
  min_num_sv: 4
  max_num_sv: 100
  max_pdop: 1000.0
  max_h_acc_m: 2.0
  max_v_acc_m: 3.0
  max_vel_acc_mps: 1000.0
  reject_nonpositive_pdop: true
  reject_nonpositive_vel_acc: true

  # Never claim more precision than the PPK standard-deviation fields.
  min_sigma_xy_m: 0.03
  min_sigma_z_m: 0.05
  max_sigma_xy_m: 2.0
  max_sigma_z_m: 3.0
  min_sigma_vel_mps: 0.05

  fixed_confirm_count: 5
  fixed_lost_count: 3
  recovery_confirm_count: 10
  max_time_gap_s: 0.5
  require_monotonic_time: true

  accept_rtk_fixed: true
  accept_rtk_float: true
  accept_differential: false
  accept_single: false

  frame_id: "map"
  child_frame_id: "gnss_antenna"
  log_interval_s: 1.0
