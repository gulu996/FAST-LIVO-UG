# Same estimator parameters as elevation_visual_repair.yaml; diagnostic log only.
# GNSS checkpoints/ground truth are never estimator inputs.
common:
  max_img_buffer_size: 128
  max_lidar_buffer_size: 128
  max_imu_buffer_size: 12000
preprocess:
  point_filter_num: 1
  filter_size_surf: 0.10
vio:
  img_point_cov: 100.0
uav:
  gravity_align_en: true
local_map:
  sliding_thresh: 8.0
rtk_backend:
  gnss_reacquisition_en: true
  gnss_reacquisition_consistency_m: 0.5
  gnss_recovery_gap_threshold_s: 5.0
  gnss_recovery_fixed_confirm_factors: 5
  gnss_recovery_fixed_max_gap_s: 0.5
  gnss_recovery_ramp_duration_s: 0.0
  gnss_recovery_initial_sigma_scale: 1.0
  livo_gravity_consistency_en: true
  raw_odom_gravity_aligned: true
  prior_roll_pitch_sigma_rad: 0.05
  save_text_log: true
pcd_save:
  save_log_en: true
diagnostics:
  csv_flush_interval_rows: 100
lio_motion_guard:
  # Experimental city1 recovery: after a sustained rejected-update streak,
  # rebuild only the stale local LiDAR/visual maps around the committed state.
  # No checkpoint or ground-truth value enters this decision.
  rebootstrap_after_consecutive_rejections: 10
  rebootstrap_rearm_consecutive_updates: 20
