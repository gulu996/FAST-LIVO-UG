source: serial
port: /dev/uwb
baud: 115200
parser_mode: distance_round5
distance_lines_per_round: 5
round_timeout_s: 2.0
round_timestamp_policy: first_distance_line
anchor_order: [0, 1]
range_scale: 1.0
range_bias_m: {}
min_range_m: 0.05
max_range_m: 250.0
repeat_epsilon_m: 0.001
repeat_max_count: 3
repeat_max_duration_s: 2.0
replay_mode: preserve
replay_rate_hz: 10.0
replay_uncertainty_ns: 1000000
timestamp_mode: host_local
imu_timeshare_path: ""
imu_anchor_warn_age_s: 0.020
imu_anchor_max_age_s: 0.100
time_offset_s: 0.0
